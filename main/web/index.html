<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f3eb">
<title>IKEA Işıklar</title>
<style>
/* Palette by Codex */
:root{color-scheme:light;--bg:#f7f3eb;--card:#fffcf7;--text:#28241f;--muted:#665e53;--border:#ded5c7;--accent:#8a4b17;--on-accent:#fff;--accent-soft:#f8e3bd;--glow:#ffd27a;--ok:#226b4a;--danger:#a4382f}
/* theme: follows the phone unless the page's theme button picked light or dark */
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#1c1a17;--card:#29251f;--text:#f4eadb;--muted:#b9ad9e;--border:#494135;--accent:#f6bc69;--on-accent:#2d1b08;--accent-soft:#49351e;--glow:#c98232;--ok:#86d9a6;--danger:#ff9b8e}}
:root[data-theme=dark]{color-scheme:dark;--bg:#1c1a17;--card:#29251f;--text:#f4eadb;--muted:#b9ad9e;--border:#494135;--accent:#f6bc69;--on-accent:#2d1b08;--accent-soft:#49351e;--glow:#c98232;--ok:#86d9a6;--danger:#ff9b8e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:960px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 16px}
.clock{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:1.05rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.clock .ico{width:20px;height:20px;color:var(--accent)}
.alert{margin:-6px 0 14px;padding:8px 12px;border:1px solid var(--danger);border-radius:12px;color:var(--danger);font-size:.9rem}
.sig{display:inline-flex;align-items:flex-end;gap:2px;height:14px;margin-right:6px;vertical-align:-1px}
.sig i{width:4px;border-radius:1px;background:var(--border)}
.sig i.on{background:var(--ok)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.pref{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-bottom:14px}
.pref>span:first-child{color:var(--muted);font-size:.9rem}
.lang.big button{white-space:nowrap;padding:0 12px}
#themeSw button{padding:0 10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;color:var(--accent)}
.logo svg{width:100%;height:100%;display:block}
.logo .lit{opacity:1}
h1{font-size:1.6rem;margin:0}
h2{font-size:1.1rem;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h2 .ico{color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex-basis:100%}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;padding:4px 10px;border-radius:99px;border:1px solid var(--border);color:var(--muted);background:var(--card)}
.chip .ico{width:14px;height:14px}
.chip.ok{color:var(--ok);border-color:currentColor}
.chip.bad{color:var(--danger);border-color:currentColor}
.lang{display:inline-flex;border:1px solid var(--border);border-radius:99px;overflow:hidden;background:var(--card)}
.lang button{min-height:28px;padding:0 10px;border:0;border-radius:0;background:none;font-size:.8rem;color:var(--muted)}
.lang button.sel{background:var(--accent);color:var(--on-accent)}
.lang button .ico{width:15px;height:15px;vertical-align:-3px}
.lang.big button{min-height:40px;padding:0 18px;font-size:.95rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.bar .ico{width:20px;height:20px}
button,select,input{font:inherit;color:inherit}
button{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--border);background:var(--card);cursor:pointer}
.bar button{display:inline-flex;align-items:center;gap:8px}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.5;cursor:wait}
button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
button.ghost{background:transparent}
button.danger{color:var(--danger)}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
select,input[type=text],input[type=password]{min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--border);background:var(--bg);width:100%}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:720px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px}
.ico{display:inline-block;width:18px;height:18px;flex:none}
.ico svg{width:100%;height:100%;display:block}
/* SVG illustrations by Codex: .lit glows when the room is on */
.lit{fill:var(--glow);opacity:.2;transition:opacity .4s}
.soft{fill:var(--accent-soft)}
.room-head{display:flex;align-items:center;gap:12px}
.scene{width:104px;flex:none;color:var(--muted);transition:color .4s}
.scene svg{width:100%;height:auto;display:block}
button.scene{min-height:0;padding:4px;border:1px dashed transparent;border-radius:12px;background:none;cursor:pointer}
button.scene:hover{border-color:var(--border)}
.picker{margin-top:12px;padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--bg)}
.picker .meta{margin-bottom:8px}
.picker .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.picker button{min-height:0;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--muted)}
.picker button svg{width:100%;max-width:84px;height:auto;color:var(--accent)}
.picker button .lit{opacity:.8}
.picker button.sel{border:2px solid var(--accent);color:var(--text)}
.picker .auto{grid-column:1/-1;min-height:40px;flex-direction:row;justify-content:center;font-size:.85rem}
.card.on .scene{color:var(--accent)}
.card.on .scene .lit{opacity:1;filter:drop-shadow(0 0 5px var(--glow))}
.room-info{flex:1;min-width:0}
.room-info .onoff{margin-top:8px}
.room-name{font-weight:650;font-size:1.15rem;background:none;border:0;padding:0;min-height:0;text-align:left;cursor:text}
.room-name:hover{text-decoration:underline dotted;text-underline-offset:4px}
.meta{color:var(--muted);font-size:.85rem}
.onoff{display:flex;gap:6px}
.onoff button{min-width:64px}
.onoff .on{background:var(--accent-soft);border-color:var(--glow)}
.row{display:flex;align-items:center;gap:10px;margin-top:14px}
.row label{display:flex;align-items:center;gap:6px;min-width:100px;color:var(--muted);font-size:.9rem}
.row label .ico{color:var(--accent)}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:44px}
.pct{min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.temps{flex:1;min-width:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{padding:0 6px;font-size:.9rem;line-height:1.1}
.seg small{display:block;color:var(--muted);font-size:.72rem}
.seg button.sel{border:2px solid var(--accent)}
.grad{height:6px;border-radius:6px;margin-top:6px;background:linear-gradient(90deg,#ffb35c,#fff1d6,#dbe9ff)}
section{margin-top:24px}
details.card>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:28px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary .ico{color:var(--accent);width:22px;height:22px}
details.card>summary .meta{margin:0 auto 0 0;font-weight:400}
details.card>summary::after{content:"▾";color:var(--muted)}
details[open].card>summary::after{content:"▴"}
details.card>summary+*{margin-top:14px}
.empty{color:var(--muted);text-align:center;padding:28px 16px}
.empty .art{width:180px;max-width:70%;margin:0 auto 10px;color:var(--accent)}
.empty .art svg{width:100%;height:auto;display:block}
.empty .art .lit{opacity:.9}
.pair-live{border-color:var(--glow);box-shadow:0 0 0 4px var(--accent-soft)}
.count{font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums}
ol{padding-left:20px;margin:8px 0}
ol li{margin:4px 0}
.events{list-style:none;padding:0;margin:0;max-height:260px;overflow:auto;font-size:.9rem}
.events li{padding:6px 0;border-top:1px solid var(--border)}
.events time{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:8px}
.dev{display:grid;grid-template-columns:auto 1fr minmax(120px,170px) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--border)}
.dev .ico{width:26px;height:26px;color:var(--accent)}
.dev .id{font-size:.8rem;color:var(--muted);word-break:break-all}
@media (max-width:560px){.dev{grid-template-columns:auto 1fr}.dev select,.dev .onoff{grid-column:2}}
.form{display:grid;gap:10px}
.pw{display:flex;gap:6px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.night{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.night label{display:flex;align-items:center;gap:8px;min-height:36px;cursor:pointer}
.night label .ico{color:var(--accent)}
.night input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.night select{width:auto;min-height:36px;padding:0 8px}
.night .range{display:flex;align-items:center;gap:6px;margin-left:auto}
.night .meta{flex-basis:100%}
.sub{padding-top:16px;margin-top:16px;border-top:1px solid var(--border)}
.sub:first-child{margin-top:0}
.nrow{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;padding:10px;margin-top:10px;border:1px solid var(--border);border-radius:14px;transition:box-shadow .3s,border-color .3s}
.nrow.flash{border-color:var(--glow);box-shadow:0 0 0 4px var(--accent-soft)}
.nrow b{font-weight:650}
.nrow label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.9rem;cursor:pointer}
.nrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.nrow .nsel{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.nrow select{width:auto;min-height:38px;padding:0 8px}
.nrow .nsel span{color:var(--muted);font-size:.9rem}
.night .edit{min-height:36px;padding:0 10px;margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:.85rem}
.night .edit .ico{width:16px;height:16px;color:var(--accent)}
.sub.pair-live{border:1px solid var(--glow);border-radius:14px;padding:14px;box-shadow:0 0 0 4px var(--accent-soft)}
.sub.pair-live+.sub{border-top:0}
#settings>summary{font-size:1.1rem}
.hide{display:none!important}
</style>
</head>
<body>
<main>
<header>
  <div class="brand"><span class="logo" data-img="logo"></span><h1 data-i18n="title">IKEA Işıklar</h1></div>
  <span class="clock" id="cTime"><i class="ico" data-img="clock"></i><span>--:--</span></span>
</header>
<div id="alert" class="alert hide"></div>

<div id="setupFirst" class="card pair-live hide" style="margin-bottom:16px">
  <h2 data-i18n="setupTitle">Önce WiFi'yi ayarla</h2>
  <p class="meta" data-i18n-html="setupText"></p>
  <div id="setupSlot"></div>
</div>

<div class="bar">
  <button class="primary" data-all="off"><i class="ico" data-img="power"></i><span data-i18n="allOff">Tüm ışıkları kapat</span></button>
  <button data-all="on"><i class="ico" data-img="sun"></i><span data-i18n="allOn">Tümünü aç</span></button>
</div>

<div id="rooms" class="grid"></div>

<section>
  <details class="card" id="settings">
    <summary><i class="ico" data-img="gear"></i><span data-i18n="settings">Ayarlar</span> <span class="meta" data-i18n="settingsMeta"></span></summary>
    <div>
    <div id="nightCard" class="sub">
      <h2><i class="ico" data-img="moon"></i><span data-i18n="night">Gece modu</span></h2>
      <div class="meta" data-i18n="nightHelp"></div>
      <div id="nightList"></div>
    </div>

    <div id="pairCard" class="sub">
      <h2><i class="ico" data-img="plus"></i><span data-i18n="addDevice">Cihaz ekle</span></h2>
      <div id="pairIdle" class="form">
        <label class="meta" for="pairRoom" data-i18n="whichRoom">Hangi odaya?</label>
        <select id="pairRoom"></select>
        <input id="newRoomName" type="text" maxlength="18" data-i18n-ph="newRoomPh" class="hide">
        <button class="primary" id="pairStart" data-i18n="pairStart">Eşlemeyi başlat (3 dk)</button>
      </div>
      <div id="pairLive" class="hide">
        <div class="room-head" style="justify-content:space-between">
          <div><div class="meta" id="pairFor"></div><div class="count" id="pairLeft">3:00</div></div>
          <button id="pairStop" data-i18n="finish">Bitir</button>
        </div>
        <ol data-i18n-html="pairSteps"></ol>
        <h2 style="margin-top:14px" data-i18n="joined">Katılan cihazlar</h2>
        <ul class="events" id="pairEvents"></ul>
      </div>
    </div>

    <div class="sub" id="devCard">
      <h2><i class="ico" data-img="lamp"></i><span data-i18n="devices">Cihazlar</span> <span class="meta" id="devCount"></span></h2>
      <div id="devices"></div>
    </div>

    <div class="sub" id="wifiCard">
      <h2><i class="ico" data-img="wifi"></i><span data-i18n="wifiSettings">WiFi ayarları</span></h2>
      <div id="wifiForm" class="form">
        <div id="wifiNow"></div>
        <div class="pw"><select id="ssidSel"><option value="" data-i18n="scanPick">Ağ seçmek için tara…</option></select><button id="scan" data-i18n="scan">Tara</button></div>
        <input id="ssid" type="text" data-i18n-ph="ssidPh" autocomplete="off">
        <div class="pw"><input id="pass" type="password" data-i18n-ph="passPh" autocomplete="off"><button id="showPw" type="button" data-i18n="show">Göster</button></div>
        <button class="primary" id="saveWifi" data-i18n="saveWifi">Kaydet ve yeniden başlat</button>
        <div class="meta" data-i18n="bootNote"></div>
      </div>
    </div>

    <div class="sub">
      <h2><i class="ico" data-img="mesh"></i><span>Zigbee</span></h2>
      <div id="zbInfo"></div>
    </div>

    <div class="sub">
      <h2><i class="ico" data-img="globe"></i><span data-i18n="appearance">Görünüm</span></h2>
      <div class="pref"><span data-i18n="theme">Tema</span>
        <span class="lang big" role="group" id="themeSw"><button data-theme-set="auto"><i class="ico" data-img="theme-auto"></i> <span data-i18n="themeAutoL"></span></button><button data-theme-set="light"><i class="ico" data-img="sun"></i> <span data-i18n="themeLightL"></span></button><button data-theme-set="dark"><i class="ico" data-img="moon"></i> <span data-i18n="themeDarkL"></span></button></span></div>
      <div class="pref"><span data-i18n="language">Dil</span>
        <span class="lang big" role="group" aria-label="Dil / Language"><button data-lang="tr">Türkçe</button><button data-lang="en">English</button></span></div>
    </div>

    <div class="sub">
      <h2><i class="ico" data-img="list"></i><span data-i18n="events">Son olaylar</span></h2>
      <ul class="events" id="events"></ul>
    </div>
    </div>
  </details>
</section>
</main>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HOURS=sel=>[...Array(24).keys()].map(h=>`<option value="${h}"${h==sel?' selected':''}>${String(h).padStart(2,'0')}:00</option>`).join('');
/* SVG illustrations and icons by Codex (source files in main/web/svg/) */

/* theme: auto (phone setting), light or dark; kept per browser */
let theme='auto';try{theme=localStorage.getItem('theme')||'auto'}catch(e){}
function applyTheme(){
  if(theme==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=theme;
  const dark=theme==='dark'||(theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelector('meta[name=theme-color]').content=dark?'#1c1a17':'#f7f3eb';
  document.querySelectorAll('[data-theme-set]').forEach(b=>b.classList.toggle('sel',b.dataset.themeSet===theme));
}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);

[/^Zigbee calismiyor, ag sifirlanamadi$/,'Zigbee is not running, network not reset'],
[/^Zigbee, WiFi ayarlandiktan sonra baslayacak$/,'Zigbee will start after WiFi is set up'],

let lang='tr';
try{lang=localStorage.getItem('lang')||''}catch(e){}
if(!L[lang])lang=(navigator.language||'').toLowerCase().startsWith('tr')?'tr':'en';
const t=(k,...a)=>(L[lang][k]??L.tr[k]??k).replace(/\{(\d)\}/g,(_,i)=>a[i]);
const tmsg=s=>{if(lang!=='en')return s;for(const[re,r]of EVT_EN)if(re.test(s))return s.replace(re,r);return s};
function applyLang(){
  document.documentElement.lang=lang;document.title=t('title');
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(e=>e.innerHTML=t(e.dataset.i18nHtml));
  document.querySelectorAll('[data-i18n-ph]').forEach(e=>e.placeholder=t(e.dataset.i18nPh));
  document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('sel',b.dataset.lang===lang));
  document.querySelectorAll('[data-theme-set]').forEach(b=>{const k={auto:'themeAuto',light:'themeLight',dark:'themeDark'}[b.dataset.themeSet];b.title=t(k);b.setAttribute('aria-label',t(k))});
  $('#themeSw').setAttribute('aria-label',t('themeGroup'));
  $('#showPw').textContent=t($('#pass').type==='password'?'show':'hide');
}

/* browser time zone -> POSIX TZ for the ESP (DST rules included for common zones) */
const TZMAP={'Europe/London':'GMT0BST,M3.5.0/1,M10.5.0','Europe/Dublin':'IST-1GMT0,M10.5.0,M3.5.0/1','Europe/Lisbon':'WET0WEST,M3.5.0/1,M10.5.0',
'Europe/Istanbul':'<+03>-3','Europe/Berlin':'CET-1CEST,M3.5.0,M10.5.0/3','Europe/Amsterdam':'CET-1CEST,M3.5.0,M10.5.0/3','Europe/Paris':'CET-1CEST,M3.5.0,M10.5.0/3',
'Europe/Brussels':'CET-1CEST,M3.5.0,M10.5.0/3','Europe/Madrid':'CET-1CEST,M3.5.0,M10.5.0/3','Europe/Rome':'CET-1CEST,M3.5.0,M10.5.0/3','Europe/Vienna':'CET-1CEST,M3.5.0,M10.5.0/3',
'Europe/Zurich':'CET-1CEST,M3.5.0,M10.5.0/3','Europe/Stockholm':'CET-1CEST,M3.5.0,M10.5.0/3','Europe/Athens':'EET-2EEST,M3.5.0/3,M10.5.0/4','Europe/Helsinki':'EET-2EEST,M3.5.0/3,M10.5.0/4'};
function browserTz(){
  const z=Intl.DateTimeFormat().resolvedOptions().timeZone;if(TZMAP[z])return TZMAP[z];
  const o=new Date().getTimezoneOffset();if(o%60)return null;return 'UTC'+(o>=0?'+':'-')+Math.abs(o/60);
}
let tzSent=false;
const TEMPS=[[2200,'warm'],[2700,'natural'],[4000,'cool']];
/* room illustration picked from the room name (Turkish and English words) */
const SCENES=[[/salon|oturma|living|lounge|sitting/,'living'],[/mutfak|kitchen|yemek|dining/,'kitchen'],[/yatak|bed/,'bedroom'],
[/banyo|bath|wc|tuvalet|toilet/,'bath'],[/çocuk|cocuk|bebek|kid|child|nursery|oyun/,'kids'],[/ofis|çalışma|calisma|office|study|desk/,'office'],
[/hol|koridor|antre|giriş|giris|hall|entr|corridor/,'hall']];
/* icon numbers stored on the ESP: 0 = auto, 1..8 = this list (keep the order) */
const ICONS=['living','kitchen','bedroom','bath','kids','office','hall','generic'];
const autoScene=name=>{const n=(name||'').toLocaleLowerCase('tr');for(const[re,k]of SCENES)if(re.test(n))return k;return 'generic'};
const sceneFor=r=>img('room-'+(ICONS[(r.icon||0)-1]||autoScene(r.name)));
let picking=0;
let S=null,lastEv=0,pairEvFrom=0,ui={},busy=false,editing=false,evLog=[];

function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(el._h);el._h=setTimeout(()=>el.classList.remove('show'),2600)}
async function post(path,params){
  const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(params)});
  const j=await r.json().catch(()=>({ok:false,error:t('connErr')}));
  if(!j.ok)throw new Error(tmsg(j.error||t('err')));return j;
}
async function act(btn,fn,okMsg){
  if(btn)btn.disabled=true;
  try{await fn();if(okMsg)toast(okMsg)}catch(e){toast(t('failed',e.message))}
  finally{if(btn)btn.disabled=false}
}
const cmd=(room,a,v)=>post('/api/cmd',{room,a,v:v??0});
const roomName=r=>r.name||t('room',r.id);
const pl=(n,w)=>lang==='en'&&n!=1?w+'s':w; /* English plural */
const counts=(a,b)=>lang==='en'?`${a} ${pl(a,'lamp')} · ${b} ${pl(b,'remote')}`:t('counts',a,b);
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const hh=h=>String(h).padStart(2,'0')+':00';
const PCTS=[1,2,5,10,20,30,50],DELAYS=[1,2,5,10,15,30,60];
const opts=(list,cur,fmt)=>(list.includes(cur)?list:list.concat(cur).sort((a,b)=>a-b)).map(v=>`<option value="${v}"${v==cur?' selected':''}>${fmt(v)}</option>`).join('');
let nightHtml='',nightFocus=false;
function renderNight(){
  const html=S.rooms.length?S.rooms.map(r=>{const n=r.night||{on:true,from:0,to:4,pct:1,delay:5},p=n.pct||1,d=n.delay||5;
    return `<div class="nrow" id="nrow-${r.id}" data-nroom="${r.id}"><b>${esc(roomName(r))}</b>
      <label><input type="checkbox" data-n="on" ${n.on?'checked':''}>${t('nightActive')}</label>
      <div class="nsel"><select data-n="from" aria-label="${t('nStart')}">${HOURS(n.from)}</select><span>–</span>
      <select data-n="to" aria-label="${t('nEnd')}">${HOURS(n.to)}</select></div>
      <div class="nsel"><select data-n="delay" aria-label="${t('afterMin')}">${opts(DELAYS,d,v=>t('minutes',v))}</select><span>${t('afterMin')}</span>
      <select data-n="pct" aria-label="${t('dimTo')}">${opts(PCTS,p,v=>'%'+v)}</select>${t('dimToEnd')?`<span>${t('dimToEnd')}</span>`:''}</div></div>`}).join('')
    :`<div class="empty">${t('noRoomsShort')}</div>`;
  if(html===nightHtml||nightFocus)return;
  nightHtml=html;$('#nightList').innerHTML=html;
}
function openNight(id){
  $('#settings').open=true;
  const row=$('#nrow-'+id);if(!row)return;
  row.scrollIntoView({behavior:'smooth',block:'center'});
  row.classList.add('flash');setTimeout(()=>row.classList.remove('flash'),1800);
}
const setAlert=m=>{const a=$('#alert');a.textContent=m||'';a.classList.toggle('hide',!m)};
/* WiFi signal: 4 bars and a word */
function signal(rssi){
  const lv=rssi>=-55?4:rssi>=-67?3:rssi>=-75?2:1,w=['','sigWeak','sigFair','sigGood','sigGreat'][lv];
  return `<span class="sig" aria-hidden="true">${[5,8,11,14].map((h,i)=>`<i class="${i<lv?'on':''}" style="height:${h}px"></i>`).join('')}</span>${t('sigText',t(w),rssi)}`;
}
const kv=rows=>'<dl class="kv">'+rows.map(([k,v])=>`<dt>${t(k)}</dt><dd>${v}</dd>`).join('')+'</dl>';

function renderRooms(){
  const el=$('#rooms');
  if(!S.rooms.length){el.innerHTML=`<div class="card empty"><div class="art">${img('empty')}</div>${t('noRooms')}</div>`;return}
  el.innerHTML=S.rooms.map(r=>{const u=ui[r.id]||{};
    const on=r.on??u.on, dim=r.level??u.dim??80, n=r.night||{on:true,from:0,to:4};
    const near=r.kelvin?TEMPS.reduce((a,b)=>Math.abs(b[0]-r.kelvin)<Math.abs(a[0]-r.kelvin)?b:a)[0]:u.temp;
    return `
  <div class="card${on===true?' on':''}" data-room="${r.id}">
    <div class="room-head">
      <button class="scene" data-pick="${r.id}" title="${t('pickTip')}" aria-label="${t('pickTip')}">${sceneFor(r)}</button>
      <div class="room-info"><button class="room-name" data-rename="${r.id}" title="${t('rename')}">${esc(roomName(r))}</button>
      <div class="meta">${on===true?`<b>${t('isOn')}</b> · `:on===false?t('isOff')+' · ':''}${counts(r.lamps,r.remotes)}</div>
      <div class="onoff"><button data-a="on" class="${on===true?'on':''}">${t('on')}</button><button data-a="off" class="${on===false?'on':''}">${t('off')}</button></div></div>
    </div>
    ${picking===r.id?`<div class="picker"><div class="meta">${t('pickTitle')}</div><div class="opts">
      <button class="auto${r.icon?'':' sel'}" data-icon="0">${t('pickAuto')}</button>
      ${ICONS.map((k,i)=>`<button data-icon="${i+1}" class="${r.icon===i+1?'sel':''}">${img('room-'+k)}<span>${t('sc_'+k)}</span></button>`).join('')}</div></div>`:''}
    <div class="row"><label><i class="ico">${img('sun')}</i>${t('brightness')}</label><input type="range" min="1" max="100" value="${dim}" data-dim aria-label="${t('brightness')}"><span class="pct">${dim}%</span></div>
    <div class="row"><label><i class="ico">${img('temp')}</i>${t('colour')}</label><div class="temps"><div class="seg">${TEMPS.map(([k,n])=>`<button data-temp="${k}" class="${near===k?'sel':''}">${t(n)}<small>${k} K</small></button>`).join('')}</div><div class="grad"></div></div></div>
    <div class="night" data-night>
      <label><input type="checkbox" data-night-on ${n.on?'checked':''}><i class="ico">${img('moon')}</i>${t('night')}</label>
      <button class="ghost edit" data-night-edit title="${t('nightEdit')}"><i class="ico">${img('edit')}</i>${t('edit')}</button>
    </div>
  </div>`}).join('');
}

function renderPair(){
  const p=S.pairing,sel=$('#pairRoom'),cur=sel.value;
  sel.innerHTML=S.rooms.map(r=>`<option value="${r.id}">${esc(roomName(r))}</option>`).join('')+`<option value="new">${t('newRoom')}</option>`;
  sel.value=cur&&[...sel.options].some(o=>o.value==cur)?cur:(S.rooms.length?String(S.rooms[0].id):'new');
  $('#newRoomName').classList.toggle('hide',sel.value!=='new');
  $('#pairIdle').classList.toggle('hide',p.open);
  $('#pairLive').classList.toggle('hide',!p.open);
  $('#pairCard').classList.toggle('pair-live',p.open);
  if(p.open&&!renderPair.wasOpen)$('#settings').open=true;renderPair.wasOpen=p.open;
  if(p.open){const r=S.rooms.find(x=>x.id==p.room);$('#pairFor').textContent=t('pairOpen',r?roomName(r):t('room',p.room));$('#pairLeft').textContent=fmt(p.left)}
}

function renderDevices(){
  $('#devCount').textContent=lang==='en'?`${S.devices.length} ${pl(S.devices.length,'device')}`:t('nDev',S.devices.length);
  if(!S.devices.length){$('#devices').innerHTML=`<div class="empty">${t('noDev')}</div>`;return}
  const opts=sel=>`<option value="0"${sel?'':' selected'} disabled>${t('noRoom')}</option>`+S.rooms.map(r=>`<option value="${r.id}"${r.id==sel?' selected':''}>${esc(roomName(r))}</option>`).join('');
  $('#devices').innerHTML=S.devices.map(d=>`
  <div class="dev" data-i="${d.i}"><i class="ico">${img(d.type==='remote'?'remote-round':'lamp')}</i>
    <div><div>${d.type==='remote'?t('remote'):t('lamp')} #${d.i}</div><div class="id">${d.addr} · ${d.ieee}</div></div>
    <select data-move aria-label="${t('room','')}">${opts(d.room)}</select>
    <div class="onoff">${d.type==='remote'?`<button class="ghost" data-arrows title="${t('rebindTip')}">${t('rebind')}</button>`:''}<button class="ghost danger" data-forget>${t('forget')}</button></div>
  </div>`).join('');
}

function renderStatus(){
  const w=S.wifi;
  $('#cTime').lastElementChild.textContent=S.time||'--:--';
  if(!tzSent&&S.wifi.mode==='sta'){tzSent=true;const tz=browserTz();if(tz&&tz!==S.tz)post('/api/tz',{tz}).catch(()=>{})}
  setAlert(w.mode==='ap'?'':!w.connected?t('wifiWait'):!S.ready?t('zbStart'):'');
  $('#wifiNow').innerHTML=w.mode==='ap'?`<div class="meta">${t('apNow')}</div>`:w.connected?
    kv([['kvState',t('isConnected')],['kvIp',esc(w.ip)]].concat(w.rssi?[['sigLabel',signal(w.rssi)]]:[])):`<div class="meta">${t('connecting')}</div>`;
  $('#zbInfo').innerHTML=S.ready?kv([['kvState',t('zbRun')],['kvChannel',S.channel],['kvPan','0x'+S.pan.toString(16).toUpperCase().padStart(4,'0')],['kvDevices',S.devices.length]])
    :`<div class="meta">${w.mode==='ap'?t('zbAp'):t('zbStart')}</div>`;
  const setup=w.mode==='ap',form=$('#wifiForm');
  $('#setupFirst').classList.toggle('hide',!setup);
  if(setup&&form.parentElement.id!=='setupSlot')$('#setupSlot').appendChild(form);
  if(!setup&&form.parentElement.id==='setupSlot')$('#wifiCard').appendChild(form);
}

function renderEvents(){
  const li=e=>`<li><time>${fmt(e.t)}</time>${esc(tmsg(e.msg))}</li>`;
  $('#events').innerHTML=evLog.slice().reverse().map(li).join('');
  $('#pairEvents').innerHTML=S&&S.pairing.open?evLog.filter(e=>e.id>pairEvFrom).reverse().map(li).join(''):'';
}

async function refresh(){
  try{
    S=await (await fetch('/api/state')).json();
    renderStatus();renderPair();renderDevices();renderNight();
    if(!editing&&!busy)renderRooms();
  }catch(e){setAlert(t('noConn'))}
}

async function pollEvents(){
  try{
    const evs=await (await fetch('/api/events?after='+lastEv)).json();
    if(!evs.length)return;
    for(const e of evs){lastEv=e.id;evLog.push(e)}
    if(evLog.length>60)evLog=evLog.slice(-60);
    renderEvents();
  }catch(e){}
}

/* theme switch */
document.querySelectorAll('[data-theme-set]').forEach(b=>b.addEventListener('click',()=>{
  theme=b.dataset.themeSet;try{localStorage.setItem('theme',theme)}catch(e){}applyTheme();
}));

/* language switch */
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{
  lang=b.dataset.lang;try{localStorage.setItem('lang',lang)}catch(e){}
  applyLang();if(S){nightHtml='';renderStatus();renderPair();renderDevices();renderNight();renderRooms();renderEvents()}
}));

/* room card actions */
$('#rooms').addEventListener('click',e=>{
  const card=e.target.closest('[data-room]');if(!card)return;
  const id=+card.dataset.room,b=e.target.closest('button');if(!b)return;
  ui[id]=ui[id]||{};
  if(b.dataset.nightEdit!==undefined){openNight(id);return}
  if(b.dataset.pick){picking=picking===id?0:id;editing=!!picking;renderRooms();return}
  if(b.dataset.icon!==undefined){const icon=+b.dataset.icon;picking=0;editing=false;
    const r=S.rooms.find(x=>x.id==id);if(r)r.icon=icon;renderRooms();
    act(null,()=>post('/api/room',{id,icon}),t('saved')).then(refresh);return}
  if(b.dataset.a){act(b,()=>cmd(id,b.dataset.a),null).then(()=>{ui[id].on=b.dataset.a==='on';renderRooms();setTimeout(refresh,1200)})}
  else if(b.dataset.temp){const k=+b.dataset.temp;act(b,()=>cmd(id,'temp',k)).then(()=>{ui[id].temp=k;renderRooms();setTimeout(refresh,1200)})}
  else if(b.dataset.rename){
    editing=true;const r=S.rooms.find(x=>x.id==id);
    const inp=document.createElement('input');inp.type='text';inp.maxLength=18;inp.value=r.name;inp.placeholder=t('room',id);
    b.replaceWith(inp);inp.focus();
    const done=async save=>{editing=false;if(save&&inp.value!==r.name){await act(null,()=>post('/api/room',{id,name:inp.value.trim()}),t('saved'))}refresh()};
    inp.addEventListener('keydown',ev=>{if(ev.key==='Enter')inp.blur();if(ev.key==='Escape'){inp.value=r.name;inp.blur()}});
    inp.addEventListener('blur',()=>done(true));
  }
});
$('#rooms').addEventListener('focusin',e=>{if(e.target.tagName==='SELECT')editing=true});
$('#rooms').addEventListener('focusout',e=>{if(e.target.tagName==='SELECT')editing=false});
$('#rooms').addEventListener('input',e=>{if(e.target.dataset.dim!==undefined){busy=true;e.target.nextElementSibling.textContent=e.target.value+'%'}});
$('#rooms').addEventListener('change',e=>{
  const nb=e.target.closest('[data-night]');
  if(nb){
    const id=+e.target.closest('[data-room]').dataset.room;
    const r=S.rooms.find(x=>x.id==id),n=r.night||{from:0,to:4,pct:1};
    const on=nb.querySelector('[data-night-on]').checked?1:0;
    act(null,()=>post('/api/night',{id,on,from:n.from,to:n.to,pct:n.pct||1,delay:n.delay||5}),on?t('nightSaved'):t('nightOffT')).then(()=>{editing=false;refresh()});
    return;
  }
  if(e.target.dataset.dim===undefined)return;
  const id=+e.target.closest('[data-room]').dataset.room,v=+e.target.value;
  ui[id]=ui[id]||{};ui[id].dim=v;ui[id].on=true;
  act(null,()=>cmd(id,'dim',v)).finally(()=>{busy=false});
});
document.querySelectorAll('[data-all]').forEach(b=>b.addEventListener('click',()=>act(b,()=>cmd(0,b.dataset.all),b.dataset.all==='off'?t('allOffT'):t('allOnT'))));

/* night mode settings */
$('#nightList').addEventListener('focusin',e=>{if(e.target.tagName==='SELECT')nightFocus=true});
$('#nightList').addEventListener('focusout',e=>{if(e.target.tagName==='SELECT')nightFocus=false});
$('#nightList').addEventListener('change',e=>{
  const row=e.target.closest('[data-nroom]');if(!row)return;
  const v=k=>row.querySelector(`[data-n="${k}"]`);
  const id=+row.dataset.nroom,on=v('on').checked?1:0;
  nightFocus=false;
  act(null,()=>post('/api/night',{id,on,from:v('from').value,to:v('to').value,pct:v('pct').value,delay:v('delay').value}),on?t('nightSaved'):t('nightOffT')).then(refresh);
});

/* pairing */
$('#pairRoom').addEventListener('change',()=>$('#newRoomName').classList.toggle('hide',$('#pairRoom').value!=='new'));
$('#pairStart').addEventListener('click',e=>act(e.target,async()=>{
  let room=$('#pairRoom').value;
  if(room==='new'){
    const name=$('#newRoomName').value.trim();if(!name)throw new Error(t('nameNew'));
    const used=new Set(S.rooms.map(r=>r.id));room=1;while(used.has(room))room++;
    await post('/api/room',{id:room,name});$('#newRoomName').value='';
  }
  await refresh();pairEvFrom=S.ev;$('#pairEvents').innerHTML='';
  await post('/api/pair',{room,s:180});await refresh();
}));
$('#pairStop').addEventListener('click',e=>act(e.target,async()=>{await post('/api/pair',{stop:1});await refresh()},t('pairClosed')));

/* devices */
$('#devices').addEventListener('change',e=>{
  if(e.target.dataset.move===undefined)return;
  const i=e.target.closest('[data-i]').dataset.i;
  act(null,()=>post('/api/device',{i,room:e.target.value}),t('moved')).then(refresh);
});
$('#devices').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.arrows!==undefined){
    const i=b.closest('[data-i]').dataset.i;
    act(b,()=>post('/api/device',{i,arrows:1}),t('pressRemote'));return;
  }
  if(b.dataset.forget===undefined)return;
  const i=b.closest('[data-i]').dataset.i;
  if(confirm(t('confirmForget',i)))act(b,()=>post('/api/device',{i,forget:1}),t('removed')).then(refresh);
});

/* wifi */
$('#scan').addEventListener('click',e=>act(e.target,async()=>{
  e.target.textContent=t('scanning');
  try{const r=await fetch('/api/scan');const aps=await r.json();
    if(!Array.isArray(aps))throw new Error(tmsg(aps.error||t('scanFail')));
    $('#ssidSel').innerHTML='<option value="">'+t('found',aps.length)+'</option>'+aps.sort((a,b)=>b.rssi-a.rssi).map(a=>`<option>${esc(a.ssid)}</option>`).join('');
  }finally{e.target.textContent=t('scan')}
}));
$('#ssidSel').addEventListener('change',e=>{if(e.target.value){$('#ssid').value=e.target.value;$('#pass').focus()}});
$('#showPw').addEventListener('click',e=>{const p=$('#pass');p.type=p.type==='password'?'text':'password';e.target.textContent=t(p.type==='password'?'show':'hide')});
$('#saveWifi').addEventListener('click',e=>act(e.target,async()=>{
  const ssid=$('#ssid').value.trim();if(!ssid)throw new Error(t('needSsid'));
  await post('/api/wifi',{ssid,pass:$('#pass').value});
  document.body.innerHTML=`<main><div class="card" style="margin-top:40px"><h2>${t('savedTitle')}</h2><p>${t('savedText',esc(ssid))}</p><p class="meta">${t('savedHint')}</p></div></main>`;
}));

document.querySelectorAll('[data-img]').forEach(e=>e.innerHTML=img(e.dataset.img));
applyLang();
refresh();pollEvents();
setInterval(refresh,2000);
setInterval(pollEvents,2000);
setInterval(()=>{if(S&&S.pairing.open){refresh()}},1000);
</script>
</body>
</html>
